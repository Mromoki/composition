<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>構図カメラアプリ</title>
<style>
  /* 全体のスタイルとリセット（スマホ画面に完全に固定する） */
  html, body {
    margin: 0; padding: 0;
    width: 100%; 
    height: 100dvh; /* スマホのアドレスバー等を考慮した動的な画面サイズ */
    background-color: #111; color: #fff; 
    font-family: sans-serif;
    overflow: hidden; /* スクロールを完全に禁止 */
    position: fixed; /* 画面全体が動く（ラバーバンド現象）のを防ぐ */
    top: 0; left: 0;
    display: flex; flex-direction: column;
  }
  
  /* カメラ領域（アスペクト比制御のコンテナ） */
  #camera-container-wrapper {
    flex: 1; /* 残りの画面スペースを全て埋める */
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; width: 100%; position: relative;
  }
  
  /* コンテナのサイズはJSで計算して適用する */
  #camera-container {
    position: relative; background: #000; overflow: hidden;
    transition: width 0.3s, height 0.3s;
  }
  
  /* 構図の説明を表示するエリア（画面上部） */
  #composition-desc {
    position: absolute; top: 15px; left: 15px; right: 15px;
    background: rgba(0, 0, 0, 0.6); color: #fff; padding: 10px; border-radius: 8px;
    font-size: 13px; line-height: 1.4; z-index: 20; display: none;
    pointer-events: none; backdrop-filter: blur(4px); text-align: left;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #composition-desc strong { color: #ffd700; display: block; margin-bottom: 4px; }

  /* ビデオストリーム。object-fitで歪みを防ぐ */
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  /* SVGオーバーレイ（構図ガイド用） */
  svg.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  
  /* 常時表示の四分割線（十字の点線） */
  .fixed-grid-line { stroke-width: 0.5; stroke-dasharray: 2, 2; }
  /* 切り替え式の構図ガイド */
  .guide-line { stroke-width: 1.5; fill: none; transition: stroke 0.3s; }
  
  /* UIコントロール領域 */
  #controls {
    height: 100px;
    flex-shrink: 0; /* 画面が狭くてもコントロールバーのサイズを維持する */
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px;
    padding-bottom: env(safe-area-inset-bottom); /* iPhone下部のホームバー領域を確保 */
    background-color: #000; z-index: 10;
  }
  
  /* ボタン群のスタイル */
  .btn-group { display: flex; flex-direction: column; gap: 10px; width: 80px; }
  button {
    background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px; padding: 8px 4px; font-size: 12px; cursor: pointer;
    transition: background 0.2s; backdrop-filter: blur(4px); touch-action: manipulation;
  }
  button:active { background: rgba(255, 255, 255, 0.4); }
  
  /* シャッターボタン（中央） */
  #shutter-btn {
    width: 64px; height: 64px; border-radius: 50%; background: #fff;
    border: 4px solid #aaa; outline: none; cursor: pointer; transition: transform 0.1s;
  }
  #shutter-btn:active { transform: scale(0.9); background: #eee; }
  
  /* 構図選択メニュー（左下） */
  #composition-menu {
    display: none; position: absolute; bottom: calc(110px + env(safe-area-inset-bottom)); left: 10px;
    background: rgba(0,0,0,0.8); border-radius: 8px; padding: 10px;
    max-height: 50vh; overflow-y: auto; z-index: 20; border: 1px solid #333;
  }
  #composition-menu button { display: block; width: 100%; margin-bottom: 5px; text-align: left; border: none; padding: 10px; }
  #composition-menu button.active { background: #444; font-weight: bold; }
  
  /* エラー画面 */
  #error-screen {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #111; color: #ff6b6b; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; box-sizing: border-box; z-index: 50;
  }
</style>
</head>
<body>

<div id="error-screen">
  <h2 style="margin-bottom: 10px;">カメラエラー</h2>
  <p id="error-message">カメラの権限が許可されていないか、カメラが見つかりません。<br>ブラウザの設定からカメラへのアクセスを許可してリロードしてください。</p>
</div>

<div id="camera-container-wrapper">
  <!-- 構図の説明表示エリア -->
  <div id="composition-desc"></div>

  <div id="camera-container">
    <video id="camera-video" autoplay playsinline muted></video>
    
    <!-- 構図ガイド・オーバーレイ -->
    <svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 常に表示される四分割線（画面を4つのエリアに分ける十字） -->
      <path class="fixed-grid-line" id="fixed-grid" d="M50 0 V100 M0 50 H100" stroke="rgba(255,255,255,0.5)" />
      <!-- 選択式の構図ガイド（JSでパスを描画） -->
      <g id="dynamic-guide" class="guide-line" stroke="white"></g>
    </svg>
  </div>
</div>

<div id="composition-menu">
  <!-- JavaScriptで動的に生成 -->
</div>

<div id="controls">
  <!-- 左下：構図選択 -->
  <div class="btn-group">
    <button id="comp-btn">構図選択</button>
  </div>
  
  <!-- 中央：シャッター -->
  <button id="shutter-btn"></button>
  
  <!-- 右下：アスペクト比 ＆ ガイド色 -->
  <div class="btn-group">
    <button id="aspect-btn">4:3</button>
    <button id="color-btn">色: 白</button>
  </div>
</div>

<script>
// ==========================================
// 1. 状態管理・設定データ
// ==========================================
let currentStream = null;
let currentAspectIndex = 0;

// アスペクト比の設定（縦横比を柔軟に計算するため w と h で管理）
const aspects = [
  { label: '4:3', w: 4, h: 3 },
  { label: '16:9', w: 16, h: 9 },
  { label: '1:1', w: 1, h: 1 }
];

let currentColorIndex = 0;
const colors = [
  { label: '白', value: 'white' },
  { label: '黄', value: 'yellow' },
  { label: '赤', value: '#ff4444' },
  { label: '青', value: '#44aaff' },
  { label: '黒', value: 'black' }
];

// 構図リストとSVGパス、説明文
const compositions = [
  { id: 'none', name: 'オフ', svg: '', desc: '' },
  { id: 'thirds', name: '三分割構図', svg: '<path d="M33.3 0 V100 M66.7 0 V100 M0 33.3 H100 M0 66.7 H100" />', desc: '風景、ポートレート、スナップなど、どんな撮影でも手軽に安定感を出したいときに使います。交点やライン上に被写体を配置してください。' },
  { id: 'bullseye', name: '日の丸構図', svg: '<circle cx="50" cy="50" r="20" />', desc: '花、料理、ポートレートの顔など、視線を中央に集めてインパクトを出したいときに使います。' },
  { id: 'diagonal', name: '対角線構図', svg: '<path d="M0 0 L100 100 M100 0 L0 100" />', desc: '道路、階段、電車、川など、写真に動きや躍動感を出したいときに使います。ラインに沿って被写体を配置します。' },
  { id: 'radial', name: '放射線構図', svg: '<path d="M50 50 L0 0 M50 50 L50 0 M50 50 L100 0 M50 50 L100 50 M50 50 L100 100 M50 50 L50 100 M50 50 L0 100 M50 50 L0 50" />', desc: '見上げた高層ビル群、まっすぐ続く道や線路など、強い奥行き感やスケール感を出したいときに使います。' },
  { id: 'frame', name: 'フレーム構図', svg: '<rect x="15" y="15" width="70" height="70" />', desc: '窓越しの風景など、手前にあるものを額縁に見立てて奥行きを出しつつ視線を主題に誘導したいときに使います。' },
  { id: 'symmetry', name: 'シンメトリー構図', svg: '<path d="M50 0 V100" stroke-width="3" />', desc: '神社仏閣や正面からの建築、水面のリフレクションなど、整然とした美しさや荘厳さを出したいときに使います。' },
  { id: 'scurve', name: 'S字・C字構図', svg: '<path d="M 70 20 C 20 40, 80 60, 30 80" stroke-width="2" />', desc: '曲がりくねった川や道路、丸いお皿の料理など、優雅さや柔らかさを表現したいときに使います。' },
  { id: 'triangle', name: '三角構図', svg: '<path d="M50 20 L20 80 L80 80 Z" />', desc: '山、タワー、立ち並ぶ木々など、どっしりとした安定感や高さを強調したいときに使います。' },
  { id: 'sandwich', name: 'サンドイッチ構図', svg: '<rect x="0" y="0" width="20" height="100" fill="currentColor" fill-opacity="0.3"/><rect x="80" y="0" width="20" height="100" fill="currentColor" fill-opacity="0.3"/>', desc: '建物の隙間から見える月や前ボケなど、主題を左右または上下から挟み込んで立体的に引き立たせたいときに使います。' },
  { id: 'pattern', name: '反復構図', svg: '<path d="M20 0 V100 M40 0 V100 M60 0 V100 M80 0 V100 M0 20 H100 M0 40 H100 M0 60 H100 M0 80 H100" stroke-width="0.5"/>', desc: '敷き詰められた花畑、整列した商品、ビルの窓など、リズム感や集合美を見せたいときに使います。' }
];

// ==========================================
// 2. DOM要素の取得
// ==========================================
const video = document.getElementById('camera-video');
const cameraContainer = document.getElementById('camera-container');
const wrapper = document.getElementById('camera-container-wrapper');
const dynamicGuide = document.getElementById('dynamic-guide');
const fixedGrid = document.getElementById('fixed-grid');
const compMenu = document.getElementById('composition-menu');
const compBtn = document.getElementById('comp-btn');
const aspectBtn = document.getElementById('aspect-btn');
const colorBtn = document.getElementById('color-btn');
const shutterBtn = document.getElementById('shutter-btn');
const errorScreen = document.getElementById('error-screen');
const errorMessage = document.getElementById('error-message');
const compositionDesc = document.getElementById('composition-desc');

// ==========================================
// 3. カメラ初期化処理
// ==========================================
async function initCamera() {
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }
    const constraints = {
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    };
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    errorScreen.style.display = 'none';
    
    video.onloadedmetadata = () => {
      updateContainerSize();
    };
  } catch (err) {
    console.error("Camera Error: ", err);
    errorScreen.style.display = 'flex';
    if(err.name === 'NotAllowedError') {
      errorMessage.innerHTML = 'カメラへのアクセスが拒否されました。<br>ブラウザの権限設定を確認してください。';
    }
  }
}

// ==========================================
// 4. アスペクト比の確実な適用 (JS計算)
// ==========================================
function updateContainerSize() {
  const ww = wrapper.clientWidth;
  const wh = wrapper.clientHeight;
  if (ww === 0 || wh === 0) return;

  const aspect = aspects[currentAspectIndex];
  
  // スマホの向き（縦持ち・横持ち）を判定して比率を反転
  const isPortrait = wh > ww;
  let targetRatio = aspect.w / aspect.h;
  if (isPortrait) {
    targetRatio = aspect.h / aspect.w; // 縦持ち時は 3:4 などに変換
  }

  const screenRatio = ww / wh;

  if (screenRatio > targetRatio) {
    // コンテナの方が横長：高さを基準に幅を決める
    cameraContainer.style.height = wh + 'px';
    cameraContainer.style.width = (wh * targetRatio) + 'px';
  } else {
    // コンテナの方が縦長：幅を基準に高さを決める
    cameraContainer.style.width = ww + 'px';
    cameraContainer.style.height = (ww / targetRatio) + 'px';
  }
}

// リサイズや画面回転時に再計算
window.addEventListener('resize', updateContainerSize);

// ==========================================
// 5. UI更新処理
// ==========================================
compositions.forEach((comp, index) => {
  const btn = document.createElement('button');
  btn.textContent = comp.name;
  btn.onclick = () => {
    dynamicGuide.innerHTML = comp.svg;
    compMenu.style.display = 'none';
    
    if (comp.desc) {
      compositionDesc.innerHTML = `<strong>${comp.name}</strong>${comp.desc}`;
      compositionDesc.style.display = 'block';
    } else {
      compositionDesc.style.display = 'none';
    }
    
    Array.from(compMenu.children).forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
  };
  compMenu.appendChild(btn);
});
compMenu.children[1].click();

compBtn.onclick = () => {
  compMenu.style.display = compMenu.style.display === 'block' ? 'none' : 'block';
};

aspectBtn.onclick = () => {
  currentAspectIndex = (currentAspectIndex + 1) % aspects.length;
  aspectBtn.textContent = aspects[currentAspectIndex].label;
  updateContainerSize(); 
};

colorBtn.onclick = () => {
  currentColorIndex = (currentColorIndex + 1) % colors.length;
  const targetColor = colors[currentColorIndex];
  dynamicGuide.setAttribute('stroke', targetColor.value);
  dynamicGuide.style.color = targetColor.value;
  
  fixedGrid.setAttribute('stroke', targetColor.value);
  fixedGrid.style.opacity = "0.5";
  
  colorBtn.textContent = '色: ' + targetColor.label;
};

// ==========================================
// 6. 写真撮影（クロップ処理）
// ==========================================
shutterBtn.onclick = () => {
  if(!video.videoWidth) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  const containerWidth = cameraContainer.clientWidth;
  const containerHeight = cameraContainer.clientHeight;
  const scale = window.devicePixelRatio || 1;
  canvas.width = containerWidth * scale;
  canvas.height = containerHeight * scale;
  
  const vWidth = video.videoWidth;
  const vHeight = video.videoHeight;
  const containerRatio = containerWidth / containerHeight;
  const videoRatio = vWidth / vHeight;
  
  let sourceX = 0, sourceY = 0, sourceWidth = vWidth, sourceHeight = vHeight;
  
  if (containerRatio > videoRatio) {
    sourceHeight = vWidth / containerRatio;
    sourceY = (vHeight - sourceHeight) / 2;
  } else {
    sourceWidth = vHeight * containerRatio;
    sourceX = (vWidth - sourceWidth) / 2;
  }
  
  ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
  
  const link = document.createElement('a');
  link.download = `photo_${new Date().getTime()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  
  const flash = document.createElement('div');
  flash.style.position = 'absolute';
  flash.style.top = '0'; flash.style.left = '0';
  flash.style.width = '100%'; flash.style.height = '100%';
  flash.style.backgroundColor = '#fff';
  flash.style.zIndex = '100';
  flash.style.opacity = '1';
  flash.style.transition = 'opacity 0.3s';
  document.body.appendChild(flash);
  
  setTimeout(() => { flash.style.opacity = '0'; }, 50);
  setTimeout(() => { document.body.removeChild(flash); }, 350);
};

document.addEventListener('click', (e) => {
  if(!compMenu.contains(e.target) && e.target !== compBtn) {
    compMenu.style.display = 'none';
  }
});

// 起動
window.onload = initCamera;

</script>
</body>
</html>
